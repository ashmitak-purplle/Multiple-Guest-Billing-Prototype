<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purplle POS · Guest Billing Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#F7F7F8; --border:#E4E6EA; --border-strong:#D3D6DC;
  --text:#1F2328; --text-2:#3D434C; --muted:#6B7280;
  --primary:#3A64E3; --primary-hover:#2E54C8; --primary-soft:#EAF0FD; --primary-line:#9DB2F1; --disabled:#8FA6EE;
  --brand:#7E3AF2; --focus:#D2C1FA;
  --guest:#6B7280; --dark-btn:#2F3237;
  --success:#12805C; --success-soft:#E6F5EE; --danger:#C93A3A; --danger-soft:#FCEDED; --warn:#A8620B; --warn-soft:#FDF3E4;
  --chrome:#DEE1E6; --chrome-text:#4A4F57;
  --shadow:0 12px 40px rgba(20,24,32,.10);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1115; --surface:#171A20; --surface-2:#1C2027; --border:#2A2F38; --border-strong:#3A404B;
    --text:#E8EAED; --text-2:#C9CDD4; --muted:#9AA1AC;
    --primary:#5C82F0; --primary-hover:#7092F3; --primary-soft:#1D2946; --primary-line:#3F5AA8; --disabled:#3A4F8E;
    --brand:#A77BF7; --focus:#5B3FA0; --guest:#3A404B; --dark-btn:#3A3F47;
    --success:#3DC08F; --success-soft:#132C23; --danger:#EF6B6B; --danger-soft:#341A1C; --warn:#E3A24A; --warn-soft:#33260F;
    --chrome:#202124; --chrome-text:#B5BAC1; --shadow:0 12px 40px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#171A20; --surface-2:#1C2027; --border:#2A2F38; --border-strong:#3A404B;
  --text:#E8EAED; --text-2:#C9CDD4; --muted:#9AA1AC;
  --primary:#5C82F0; --primary-hover:#7092F3; --primary-soft:#1D2946; --primary-line:#3F5AA8; --disabled:#3A4F8E;
  --brand:#A77BF7; --focus:#5B3FA0; --guest:#3A404B; --dark-btn:#3A3F47;
  --success:#3DC08F; --success-soft:#132C23; --danger:#EF6B6B; --danger-soft:#341A1C; --warn:#E3A24A; --warn-soft:#33260F;
  --chrome:#202124; --chrome-text:#B5BAC1; --shadow:0 12px 40px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg{flex:none}

/* simulated browser */
.chrome{background:var(--chrome);display:flex;align-items:flex-end;gap:2px;padding:8px 10px 0;overflow-x:auto}
.btab{display:flex;align-items:center;gap:8px;min-width:150px;max-width:230px;height:38px;padding:0 12px;border:none;background:transparent;color:var(--chrome-text);border-radius:10px 10px 0 0;font-size:13px;font-weight:600;white-space:nowrap}
.btab:hover{background:rgba(127,127,127,.12)}
.btab.active{background:var(--surface);color:var(--text)}
.btab{cursor:pointer;padding-right:6px}
.tabx{width:24px;height:24px;border:none;border-radius:50%;background:transparent;color:inherit;display:grid;place-items:center;flex:none;opacity:.7}
.tabx:hover{background:rgba(127,127,127,.22);opacity:1}
.gid{display:inline-block;margin-left:10px;font-size:12px;opacity:.75;letter-spacing:.04em;margin-top:2px}
.held{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.held-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin-bottom:12px;font-size:14.5px}
.held-sub{font-size:12.5px;color:var(--muted)}
.held-list{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(275px,1fr);gap:10px;overflow-x:auto;padding-bottom:2px}
.hcard{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.hthumbs{display:flex;flex:none}
.hthumbs svg{border-radius:7px;margin-right:-8px;box-shadow:0 0 0 2px var(--surface-2)}
.hinfo{flex:1;min-width:0;padding-left:10px}
.hid{font-weight:700;font-size:13.5px;letter-spacing:.02em}
.hid span{font-weight:500;color:var(--muted)}
.hmeta{font-size:12.5px;color:var(--text-2)}
.hleft{font-size:12px;font-weight:700;color:var(--success);font-variant-numeric:tabular-nums}
.hleft.low{color:var(--warn)}
.hbtn{height:40px;padding:0 14px;border-radius:7px;border:1.5px solid var(--primary);background:var(--surface);color:var(--primary);font-weight:700;font-size:14px;flex:none}
.hbtn:hover{background:var(--primary);color:#fff}
.fav{width:16px;height:16px;border-radius:4px;background:var(--brand);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;flex:none}
.btab .t{overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.newtab{width:32px;height:32px;margin:0 0 3px 4px;border:none;border-radius:50%;background:transparent;color:var(--chrome-text);display:grid;place-items:center;flex:none}
.newtab:hover{background:rgba(127,127,127,.18)}
.chrome-note{font-size:11px;color:var(--chrome-text);margin:0 0 12px 10px;white-space:nowrap;opacity:.8}

.topbar{min-height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 24px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;color:var(--brand);letter-spacing:-.02em}
.meta{font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.meta b{font-weight:600;color:var(--text-2)}
.shell{display:flex;min-height:calc(100vh - 110px)}
.rail{width:40px;flex:none;border-right:1px solid var(--border);background:var(--surface);color:var(--muted);display:flex;justify-content:center;padding-top:22px}
main{flex:1;min-width:0;padding:22px 24px 140px}
@media (max-width:600px){.rail{display:none}}

/* entry */
.entry{max-width:760px;margin:40px auto 0}
.entry-card{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);padding:56px 48px}
.entry-card h1{font-size:clamp(26px,4vw,38px);font-weight:500;margin:0 0 32px;letter-spacing:-.01em}
.bigfield{position:relative}
.bigfield .pre{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;font-weight:500}
.bigfield input{width:100%;height:66px;border:1.5px solid var(--border-strong);border-radius:8px;padding:0 22px;font-size:19px;letter-spacing:.06em;background:var(--surface);outline:none}
.bigfield input::placeholder{color:var(--muted);letter-spacing:.08em}
.bigfield input:focus{border-color:#A98AF5;box-shadow:0 0 0 4px var(--focus)}
.bigfield input.bad{border-color:var(--danger)}
.ferr{color:var(--danger);font-size:13px;margin:8px 2px 0;font-weight:500}
.btn-hero{width:100%;height:62px;margin-top:22px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-hero:hover{background:var(--primary-hover)}
.guest-btn{display:block;width:calc(100% - 96px);margin:56px auto 0;height:58px;background:var(--surface);border:1.5px solid var(--border-strong);border-radius:8px;color:var(--primary);font-size:19px;font-weight:500}
.guest-btn:hover{border-color:var(--primary-line);background:var(--primary-soft)}
.entry-note{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:14px;color:var(--text-2);font-size:14px;text-align:center}

/* cart */
.cart-grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;max-width:1440px;margin:0 auto;align-items:start}
@media (max-width:1180px){.cart-grid{grid-template-columns:minmax(0,1fr) 300px;gap:16px}}
@media (max-width:760px){.cart-grid{grid-template-columns:1fr}}
.crumb{font-size:18px;font-weight:700;display:flex;gap:10px;align-items:center;margin:0 0 14px}
.crumb .cur{color:var(--primary)}
.crumb svg{color:var(--muted)}
.banner{border-radius:8px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;color:#fff}
.banner.guest{background:var(--guest)}
.banner.cust{background:#4B2A9C}
.banner .who{display:flex;align-items:center;gap:14px;min-width:0}
.banner .gname{font-size:20px;font-weight:500}
.avatar{width:48px;height:48px;border-radius:50%;background:#fff;color:#4B2A9C;font-weight:800;display:grid;place-items:center;font-size:16px;flex:none}
.avatar.sm{width:44px;height:44px;background:var(--primary-soft);color:var(--primary);font-size:15px}
.cname{font-size:21px;font-weight:700;line-height:1.2}
.cmob{font-size:14px;opacity:.85;letter-spacing:.03em}
.perk{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.banner-actions{display:flex;gap:10px;flex-wrap:wrap}
.bbtn{height:46px;padding:0 18px;border-radius:8px;border:1.5px solid rgba(255,255,255,.75);background:#fff;color:#2F3237;font-weight:700;display:inline-flex;align-items:center;gap:8px;font-size:15px}
.bbtn:hover{background:#F0F2F5}
.bbtn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45);font-weight:600}
.bbtn.ghost:hover{background:rgba(255,255,255,.1)}

.idle-timer{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.idle-timer b{color:var(--text);font-variant-numeric:tabular-nums;min-width:40px;font-weight:700}
.idle-timer.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.idle-timer.warn b{color:var(--warn)}
.crumb{flex-wrap:wrap}
.guest-top{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gchip{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-size:14.5px;font-weight:600}
.gchip b{font-weight:600;color:var(--muted);font-size:12.5px;letter-spacing:.04em;padding-left:8px;border-left:1px solid var(--border)}
.gadd{height:40px;padding:0 16px;border-radius:8px;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
.gadd:hover{background:var(--primary-hover)}
.held{padding:12px 14px}
.held-h{margin-bottom:10px}

.crumb-end{height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);font-size:14px;font-weight:600}
.crumb-end:hover{border-color:var(--danger);color:var(--danger)}
.cinfo{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:22px 24px;margin-bottom:22px;display:grid;grid-template-columns:repeat(7,auto);justify-content:space-between;gap:16px 18px}
.cfield{min-width:0}
.ck{font-size:14.5px;color:var(--text-2);margin-bottom:8px;white-space:nowrap}
.cv{font-size:15.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:7px;background:var(--success-soft);color:var(--success);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:700}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor}
@media (max-width:1280px){.cinfo{grid-template-columns:repeat(4,auto)}}
@media (max-width:700px){.cinfo{grid-template-columns:1fr 1fr}.cv{white-space:normal}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.scanrow{background:var(--surface-2);padding:16px 18px;display:flex;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);align-items:center}
.scanbox{display:flex;flex:1 1 360px;min-width:0}
.scanbox input{flex:1;min-width:0;height:50px;border:1px solid var(--border-strong);border-right:none;border-radius:7px 0 0 7px;padding:0 16px;background:var(--surface);font-size:16px;outline:none}
.scanbox input:focus{border-color:var(--primary-line)}
.scanbtn{height:50px;padding:0 22px;background:var(--dark-btn);color:#fff;border:none;border-radius:0 7px 7px 0;display:flex;gap:8px;align-items:center;font-size:16px;font-weight:600}
.advisor{flex:1 1 230px;height:50px;border:1px solid var(--border-strong);border-radius:7px;padding:0 14px;background:var(--surface);font-size:16px;color:var(--text-2)}
.scanhint{flex-basis:100%;font-size:12.5px;color:var(--muted);margin-top:-6px}
.scanhint b{color:var(--text-2);font-weight:600}
.items{min-height:380px}
/* fixed cart layout: only the product list scrolls */
html:has(main.cart-mode),html:has(main.cart-mode) body{height:100%;overflow:hidden}
body:has(main.cart-mode) #root{height:100%;display:flex;flex-direction:column}
body:has(main.cart-mode) .shell{flex:1;min-height:0}
main.cart-mode{display:flex;flex-direction:column;min-height:0;overflow-y:auto;padding-bottom:18px}
main.cart-mode .cart-grid{flex:1;min-height:0;width:100%}
main.cart-mode .cart-grid>section{display:flex;flex-direction:column;height:100%;min-height:0}
main.cart-mode .cart-grid>section>*{flex:none}
main.cart-mode .cart-grid>section>.panel{flex:1 1 0;min-height:auto;display:flex;flex-direction:column}
main.cart-mode .scanrow,main.cart-mode .footer-actions{flex:none}

main.cart-mode .items{flex:1 1 0;min-height:130px;overflow-y:auto;overscroll-behavior:contain}
main.cart-mode .empty{min-height:100%}
main.cart-mode .cart-grid>aside{height:100%;overflow-y:auto;min-height:0}
main.cart-mode .cart-grid>aside>*{flex:none}
@media (max-width:760px){
  html:has(main.cart-mode),html:has(main.cart-mode) body{height:auto;overflow:visible}
  body:has(main.cart-mode) #root{height:auto;display:block}
  main.cart-mode{overflow:visible;padding-bottom:140px}
  main.cart-mode .cart-grid>section{height:auto}
  main.cart-mode .items{max-height:55vh;min-height:240px}
  main.cart-mode .cart-grid>aside{height:auto;overflow:visible}
  main.cart-mode .footer-actions{position:sticky;bottom:0;z-index:5}
}
.empty{display:grid;place-items:center;min-height:380px;color:var(--muted);font-size:clamp(20px,3vw,30px);text-align:center;padding:20px}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) 110px 150px 96px 48px;grid-template-areas:"art info price qty line rm";gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.row .art-c{grid-area:art}.row .info{grid-area:info;min-width:0}.row .rm{grid-area:rm}
.row .bottom{display:contents}
.row .price{grid-area:price}.row .qty{grid-area:qty}.row .line{grid-area:line;text-align:right;font-weight:700;font-size:16px}
.brand{font-size:12px;font-weight:700;color:var(--muted)}
.pname{font-weight:600;font-size:15.5px;line-height:1.3;margin:2px 0}
.psub{font-size:12.5px;color:var(--muted)}
.sp{font-weight:700;font-size:15.5px}
.mrp{font-size:12.5px;color:var(--muted);text-decoration:line-through}
.off{font-size:12px;color:var(--success);font-weight:700;margin-left:6px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;height:44px}
.stepper button{width:44px;height:44px;border:none;background:var(--surface);display:grid;place-items:center}
.stepper button:hover:not(:disabled){background:var(--primary-soft);color:var(--primary)}
.stepper button:disabled{color:var(--border-strong)}
.stepper span{min-width:40px;text-align:center;font-weight:700;font-size:16px}
.iconbtn{width:44px;height:44px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center}
.iconbtn:hover{color:var(--danger);background:var(--danger-soft)}
@media (max-width:700px){
  .row{grid-template-columns:56px minmax(0,1fr) 44px;grid-template-areas:"art info rm" "bottom bottom bottom";gap:10px 12px}
  .row .bottom{grid-area:bottom;display:flex;align-items:center;justify-content:space-between;gap:12px}
}
.row.selectable{cursor:pointer}
.row.selectable .stepper{pointer-events:none;opacity:.5}
.row.selectable:hover{background:var(--surface-2)}
.row.picked{background:var(--danger-soft)}
.art-c{position:relative}
.pick{position:absolute;top:-6px;left:-6px;width:22px;height:22px;margin:0;accent-color:var(--danger);z-index:1;cursor:pointer}
.sp.free{color:var(--success)}
.gift-tag{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:8px;background:var(--success-soft);color:var(--success);font-weight:700;font-size:13.5px;white-space:nowrap}
.obtn.danger{border-color:var(--danger);color:var(--danger)}
.obtn.danger:hover:not(:disabled){background:var(--danger-soft)}
.footer-actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;background:var(--surface-2);border-top:1px solid var(--border)}
.footer-actions>div{display:flex;gap:12px;flex-wrap:wrap}
.obtn{height:44px;padding:0 16px;border:1px solid var(--primary-line);color:var(--primary);background:var(--surface);border-radius:6px;display:inline-flex;gap:8px;align-items:center;font-size:15px;font-weight:500}
.obtn:hover:not(:disabled){background:var(--primary-soft)}
.obtn:disabled{opacity:.45}
.obtn.on{background:var(--primary-soft);font-weight:700}

.side{display:flex;flex-direction:column;gap:14px}
.coupon-note{text-align:center;color:var(--muted);font-size:13.5px;padding:10px 0 4px}
.summary{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.summary .in{padding:22px 24px 18px}
.summary h3{margin:0 0 18px;font-size:17px;font-weight:700}
.srow{display:flex;justify-content:space-between;margin:0 0 14px;font-size:15.5px;color:var(--text-2)}
.srow.benefit{color:var(--success);font-weight:600}
.addc{color:var(--brand);font-size:15.5px;font-weight:500;background:none;border:none;padding:0}
.net{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--border);margin-top:18px;padding-top:20px;font-weight:800}
.net span:first-child{font-size:19px}.net span:last-child{font-size:28px}
.save-note{font-size:13px;color:var(--success);font-weight:600;margin-top:8px;text-align:right}
.paywrap{padding:14px 24px 18px;border-top:1px solid var(--border)}
.paybtn{width:100%;height:56px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:18px;font-weight:700}
.paybtn:hover:not(:disabled){background:var(--primary-hover)}
.paybtn:disabled{background:var(--disabled);opacity:.75}
.nudge{border:1.5px dashed var(--primary-line);background:var(--primary-soft);border-radius:8px;padding:16px 18px}
.nudge p{margin:0 0 12px;font-size:14.5px;line-height:1.45;color:var(--text-2)}
.nudge p b{color:var(--text)}
.nbtn{width:100%;height:46px;border-radius:8px;border:1.5px solid var(--primary);background:var(--surface);color:var(--primary);font-weight:700;font-size:15.5px}
.nbtn:hover{background:var(--primary);color:#fff}

/* expired */
.state-card{max-width:520px;margin:60px auto 0;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:44px 40px;text-align:center}
.state-card h2{margin:18px 0 8px;font-size:26px}
.state-card p{margin:0;color:var(--text-2);line-height:1.5}
.state-card .fine{margin-top:14px;font-size:13px;color:var(--muted)}
.state-card .btn-hero{font-size:18px;height:56px;margin-top:28px}

/* dialogs */
.overlay{position:fixed;inset:0;background:rgba(12,14,20,.5);display:grid;place-items:center;padding:16px;z-index:40;animation:fade .15s ease-out}
.dialog{width:100%;max-width:470px;max-height:calc(100% - 16px);overflow:auto;background:var(--surface);border-radius:14px;padding:28px;box-shadow:0 24px 64px rgba(0,0,0,.28);animation:pop .18s ease-out}
.dialog h2{margin:0 0 8px;font-size:23px;letter-spacing:-.01em}
.dialog p.sub{margin:0 0 20px;color:var(--text-2);line-height:1.5;font-size:15px}
.dlabel{display:block;font-size:13.5px;font-weight:700;margin:0 0 7px;color:var(--text-2)}
.dlabel em{font-style:normal;color:var(--muted);font-weight:500}
.dfield{position:relative;margin-bottom:16px}
.dfield .pre{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:500}
.dinput{width:100%;height:52px;border:1.5px solid var(--border-strong);border-radius:8px;padding:0 14px;background:var(--surface);font-size:17px;outline:none}
.dinput.pad{padding-left:50px;letter-spacing:.05em}
.dinput:focus{border-color:#A98AF5;box-shadow:0 0 0 4px var(--focus)}
.dinput:disabled{background:var(--surface-2);color:var(--muted)}
.dinput.bad{border-color:var(--danger)}
.dactions{display:flex;gap:12px;margin-top:24px}
.dactions.stack{flex-direction:column}
.b{height:52px;border-radius:8px;font-weight:700;font-size:16px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1}
.b.primary{background:var(--primary);color:#fff;border:none}
.b.primary:hover{background:var(--primary-hover)}
.b.secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border-strong)}
.b.secondary:hover{background:var(--surface-2)}
.b.danger{background:var(--danger);color:#fff;border:none}
.b.danger-o{background:var(--surface);color:var(--danger);border:1.5px solid var(--danger)}
.b.danger-o:hover{background:var(--danger-soft)}
.linkbtn{background:none;border:none;color:var(--primary);font-weight:600;font-size:15px;padding:12px;min-height:44px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--success-soft);color:var(--success);font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:5px 11px;margin-bottom:14px}
.ccard{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:var(--surface-2)}
.ccard .nm{font-weight:700;font-size:16.5px}
.ccard .mb{color:var(--muted);font-size:14px;letter-spacing:.03em}
.ccard .cnt{margin-left:auto;text-align:right;font-weight:700;font-size:14px;white-space:nowrap}
.ccard .cnt small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.dnote{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:13.5px;color:var(--muted);line-height:1.45}
.ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin-bottom:14px}
.ic.warn{background:var(--warn-soft);color:var(--warn)}
.ic.danger{background:var(--danger-soft);color:var(--danger)}
.ic.neutral{background:var(--surface-2);color:var(--muted)}
.ic.ok{background:var(--success-soft);color:var(--success)}
.countdown{display:flex;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:12px 14px;font-weight:700;font-size:14px}
.loading{display:flex;flex-direction:column;align-items:center;padding:28px 0 12px;gap:16px;color:var(--text-2)}
.spinner{width:36px;height:36px;border-radius:50%;border:3.5px solid var(--primary-soft);border-top-color:var(--primary);animation:spin .8s linear infinite}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{height:44px;padding:0 16px;border-radius:8px;border:1.5px solid var(--border-strong);background:var(--surface);font-weight:600}
.chip.sel{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}.entry-card{padding:36px 22px}.guest-btn{width:100%}.dialog{padding:22px}.dactions{flex-direction:column-reverse}}

.toast{position:fixed;left:50%;top:calc(108px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#1F2328;color:#fff;border-radius:10px;padding:13px 18px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .2s ease-out;max-width:calc(100% - 32px)}
.toast svg{color:#5BD6A2}

/* prototype controls */
.proto{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:310px;max-width:calc(100% - 32px);background:#161A22;color:#DDE2EA;border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.35);z-index:30;font-size:13px;border:1px solid #2C3240}
.proto-h{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;background:none;border:none;color:#fff;font-weight:700;font-size:13px}
.proto-h span{display:flex;align-items:center;gap:8px}
.proto-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.proto .lbl{color:#8C95A5;font-size:12px;margin-bottom:6px}
.pbar{height:6px;background:#2C3240;border-radius:3px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:#5C82F0;transition:width .3s}
.pbtns{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{flex:1;min-height:36px;padding:0 8px;border-radius:7px;border:1px solid #3A4152;background:#1F2430;color:#DDE2EA;font-size:12.5px;font-weight:600}
.pbtn:hover:not(:disabled){background:#2A3142}
.pbtn:disabled{opacity:.4}
.pnum{display:flex;align-items:center;gap:8px}
.pnum input{width:64px;height:34px;border-radius:7px;border:1px solid #3A4152;background:#1F2430;color:#fff;padding:0 8px}
.tests{display:flex;flex-direction:column;gap:4px}
.tests button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:#1F2430;border:1px solid #2C3240;border-radius:7px;padding:8px 10px;color:#DDE2EA;font-size:12.5px}
.tests button:hover{background:#2A3142}
.tests code{font-family:inherit;font-weight:700;letter-spacing:.03em;color:#fff}
.tests small{color:#8C95A5;text-align:right}
.toggle{display:flex;gap:10px;align-items:flex-start;background:#1F2430;border:1px solid #2C3240;border-radius:7px;padding:10px;cursor:pointer;font-size:12.5px;font-weight:600;color:#fff}
.toggle input{width:18px;height:18px;margin:0;accent-color:#5C82F0;flex:none}
.toggle small{display:block;color:#8C95A5;font-weight:500;margin-top:2px}
.sess-note{background:#1F2430;border:1px solid #2C3240;border-radius:7px;padding:9px 10px;color:#AEB6C4;font-size:12px;line-height:1.45}
.sess-note b{display:block;color:#fff;font-size:12.5px;margin-bottom:2px}
.idle-row{display:flex;justify-content:space-between;font-weight:700;color:#fff}

@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.footer-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));padding:10px 14px;gap:8px}
.footer-actions>div{display:contents}
.footer-actions .obtn{height:42px;padding:0 10px;font-size:13.5px;gap:6px;white-space:nowrap;justify-content:center}
.hid{white-space:nowrap}
@media (max-width:1180px){
  .held-sub,.scanhint,.hthumbs{display:none}
  .crumb{font-size:0}
  .crumb>svg,.crumb>.cur{display:none}
  .guest-top{font-size:14px;margin-left:0}
  .hid{white-space:nowrap}
  .hcard{padding:8px 10px}
  .hbtn{height:36px;padding:0 10px}
  .scanbox{flex:1 1 240px}
  .advisor{flex:1 1 170px}
  .crumb{margin-bottom:10px;gap:8px 10px}
  .gchip,.gadd{flex:none;white-space:nowrap}
  .hinfo{padding-left:0}
  .held-list{grid-auto-columns:minmax(210px,1fr)}
  .scanrow{padding:12px 14px;gap:10px}
  .scanbox input,.scanbtn,.advisor{height:44px}
  .row{grid-template-columns:48px minmax(0,1fr) 44px;grid-template-areas:"art info rm" "bottom bottom bottom";gap:8px 12px;padding:12px 14px}
  .row .bottom{grid-area:bottom;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .row .art-c svg{width:48px;height:48px}
  .footer-actions{grid-template-columns:1fr 1fr}
  .footer-actions .obtn{font-size:13px;padding:0 8px}
}
